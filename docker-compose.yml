version: '3.8'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: saas_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/multi_vendor_ecommerce
      - NODE_ENV=production
      - JWT_SECRET=production_only_secret_key_antigravity_multivendor
      - NEXTAUTH_SECRET=production_only_nextauth_secret_key_antigravity
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
