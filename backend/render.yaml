services:
  - type: web
    name: lomentra-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false          # Set this in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random secret
      - key: NEXTAUTH_SECRET
        generateValue: true
